name: Mother Delivery Package CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_validate:
        description: "Run full qa_runner.py validate on Windows"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  quick-gate:
    name: Quick gate (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize submodules
        run: |
          git -c core.quotePath=false submodule sync --recursive
          git -c core.quotePath=false submodule update --init --recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: Compile qa runner
        run: python -m py_compile qa_runner.py

      - name: Submodule status check
        run: |
          git submodule status --recursive
          git submodule status --recursive | while read line; do
            if echo "$line" | grep -q "^-"; then
              echo "FAIL: submodule not initialized: $line"
              exit 1
            fi
          done

      - name: Consistency gate
        run: python qa_runner.py consistency

      - name: P00 audit gate
        run: python qa_runner.py validate --scope P00_SUPER_PROMPT

      - name: Route smoke probes
        run: |
          python qa_runner.py route "我要用这个母包项目完善母包自身，形成第一次真正的协同通用AI大模型项目开发实例，并把结果反哺仓库"
          python qa_runner.py route "我想用这个母包开发一个新的AI项目，从想法到需求、规格、任务、测试、交付"

      - name: Reference project smoke
        run: python _reference_projects/minimal-ai-collab-taskboard/tests/test_smoke.py

  root-acceptance:
    name: Root acceptance
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Initialize submodules
        run: |
          git -c core.quotePath=false submodule sync --recursive
          git -c core.quotePath=false submodule update --init --recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install acceptance dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest pytest-asyncio numpy flask mcp fastapi uvicorn pydantic requests cryptography networkx chromadb

      - name: ROOT validation
        run: python qa_runner.py validate --scope ROOT

      - name: Status report
        run: python qa_runner.py status

      - name: USER_PACK strict verification
        shell: pwsh
        run: |
          cd "协同通用AI大模型开发交付包"
          pwsh -NoProfile -File .\VERIFY-DELIVERY.ps1 -Strict

  full-acceptance:
    name: Full acceptance
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_validate == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Initialize submodules
        run: |
          git -c core.quotePath=false submodule sync --recursive
          git -c core.quotePath=false submodule update --init --recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node.js for SDK tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install full validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest pytest-asyncio numpy flask mcp fastapi uvicorn pydantic requests cryptography networkx chromadb python-docx

      - name: Full validation registry
        run: python qa_runner.py validate

      - name: Full status report
        run: python qa_runner.py status
