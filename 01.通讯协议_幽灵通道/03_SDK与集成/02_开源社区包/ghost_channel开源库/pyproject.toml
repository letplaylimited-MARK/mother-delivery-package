[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-channel"
version = "1.0.0"
description = "Ghost Channel Protocol - Energy-Efficient AI Communication Protocol (Open Source)"
readme = "README.md"
authors = [
    {name = "Q-SpecTrum", email = "community@q-spectrum.ai"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["ai", "protocol", "communication", "delta-sync", "gpu", "optimization", "distributed"]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
]

[project.urls]
Homepage = "https://github.com/q-spectrum/ghost-channel"
Documentation = "https://ghost-channel.readthedocs.io"
Repository = "https://github.com/q-spectrum/ghost-channel"
Issues = "https://github.com/q-spectrum/ghost-channel/issues"
Changelog = "https://github.com/q-spectrum/ghost-channel/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
disallow_untyped_defs = false
