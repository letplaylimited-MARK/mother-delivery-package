name: Feature Request
description: Suggest a new feature for the Ghost Channel Protocol
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request
        
        Thanks for suggesting a feature! Please fill out the form below.
        
  - type: input
    id: rfc-alignment
    attributes:
      label: RFC Alignment
      description: "Does this feature align with RFC 0001?"
      placeholder: "Yes/No - explain"
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: "What problem does this solve?"
      placeholder: "As a [user type], I want [goal] so that [benefit]"
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: "How should this feature work?"
      placeholder: "Describe the feature implementation"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: "Any alternative approaches?"
