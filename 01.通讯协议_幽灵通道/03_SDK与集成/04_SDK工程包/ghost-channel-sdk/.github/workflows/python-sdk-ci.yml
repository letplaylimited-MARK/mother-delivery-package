name: python-sdk-ci

on:
  push:
    paths:
      - 'ghost-channel-sdk/python/**'
      - 'ghost-channel-sdk/schemas/**'
      - 'ghost-channel-sdk/.github/workflows/python-sdk-ci.yml'
  pull_request:
    paths:
      - 'ghost-channel-sdk/python/**'
      - 'ghost-channel-sdk/schemas/**'
      - 'ghost-channel-sdk/.github/workflows/python-sdk-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: QCM/ghost-channel-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ./python

      - name: Validate schemas
        run: python python/ghost_channel/schema_validator.py

      - name: Run unit tests
        run: python -m unittest python/tests/test_sdk.py python/tests/test_schema_validator.py
