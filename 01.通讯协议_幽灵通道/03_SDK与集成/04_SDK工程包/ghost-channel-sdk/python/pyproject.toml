[project]
name = "ghost-channel-sdk"
version = "1.0.0"
description = "Ghost Channel Protocol Python SDK MVP"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["ghost-channel>=1.0.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ghost_channel_sdk"]
package-dir = {"" = "."}
